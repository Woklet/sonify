<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOM Sonar Tests</title>
  <style>
    body { background: #0d0f12; color: #d4d0c8; font-family: monospace; padding: 24px; }
    .pass { color: #5b8a72; }
    .fail { color: #b04a5a; }
    #log { white-space: pre-wrap; line-height: 1.8; }
  </style>
</head>
<body>
  <h1>DOM Sonar Tests</h1>
  <div id="log"></div>

  <script src="https://unpkg.com/tone@14"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" src="extractor.jsx"></script>
  <script type="text/babel" src="mapper.jsx"></script>
  <script type="text/babel" src="realizer.jsx"></script>

  <script type="text/babel">
    const log = document.getElementById("log");
    let passed = 0, failed = 0;

    function assert(name, condition, detail) {
      if (condition) {
        log.innerHTML += `<span class="pass">PASS</span> ${name}\n`;
        passed++;
      } else {
        log.innerHTML += `<span class="fail">FAIL</span> ${name}${detail ? " — " + detail : ""}\n`;
        failed++;
      }
    }

    function summary() {
      log.innerHTML += `\n${passed} passed, ${failed} failed\n`;
    }

    async function runTests() {
      // --- Extractor tests ---
      log.innerHTML += "\n== Extractor ==\n";

      const html = `<html><body style="margin:20px;background:#fff;color:#333">
        <header style="font-size:32px;margin-bottom:40px"><h1>Title</h1></header>
        <main style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div style="padding:12px;background:#eee"><p>Card 1</p></div>
          <div style="padding:12px;background:#eee"><p>Card 2</p></div>
        </main>
        <footer style="margin-top:40px"><p style="font-size:12px">Footer</p></footer>
      </body></html>`;

      const desc = await extractDesignDescriptor(html);

      assert("returns object", typeof desc === "object");
      assert("has elements array", Array.isArray(desc.elements));
      assert("has colorPalette", Array.isArray(desc.colorPalette));
      assert("has totalElements", typeof desc.totalElements === "number");
      assert("elements have fontSize", desc.elements.some(e => e.fontSize > 0));
      assert("elements have depth", desc.elements.every(e => typeof e.depth === "number"));
      assert("elements have whitespaceRatio", desc.elements.some(e => e.whitespaceRatio > 0));
      assert("detects grid", desc.elements.some(e => e.display === "grid"));
      assert("extracts gridColumns", desc.elements.some(e => e.gridColumns > 0));
      assert("palette has entries", desc.colorPalette.length > 0);
      assert("deterministic", JSON.stringify(desc) === JSON.stringify(await extractDesignDescriptor(html)));

      // --- Mapper tests ---
      log.innerHTML += "\n== Mapper ==\n";

      // Test color palette → mode selection
      assert("few colors → pentatonic (5 notes)",
        paletteToMode([{hex:"#fff",count:10},{hex:"#333",count:5}]).length === 5);

      assert("many colors → chromatic (12 notes)",
        paletteToMode(Array.from({length:15}, (_,i) => ({hex:`#${i}`,count:1}))).length === 12);

      // Test whitespace → rest duration
      assert("high whitespace → long rest",
        whitespaceToRest(2.0) > whitespaceToRest(0.1));

      assert("zero whitespace → no rest",
        whitespaceToRest(0) === null);

      // Test hierarchy → pitch
      assert("h1 higher pitch than p",
        hierarchyToPitch({isHeading:true,headingLevel:1,fontSize:32,visualWeight:4}, 7)
        > hierarchyToPitch({isHeading:false,headingLevel:null,fontSize:16,visualWeight:1}, 7));

      // Test grid → meter
      assert("2-col grid → duple meter",
        gridToMeter(2)[0] === 4);

      assert("3-col grid → triple meter",
        gridToMeter(3)[0] === 3);

      // Test full mapper
      const musicalDesc = mapToMusical(desc);
      assert("musical desc has key", typeof musicalDesc.key === "number");
      assert("musical desc has mode array", Array.isArray(musicalDesc.mode));
      assert("musical desc has tempo", typeof musicalDesc.tempo === "number");
      assert("musical desc has notes", Array.isArray(musicalDesc.notes));
      assert("notes have pitch", musicalDesc.notes.every(n => typeof n.midi === "number"));
      assert("notes have duration", musicalDesc.notes.every(n => typeof n.duration === "string"));
      assert("notes have velocity", musicalDesc.notes.every(n => typeof n.velocity === "number"));
      assert("some notes are rests", musicalDesc.notes.some(n => n.rest));
      assert("deterministic", JSON.stringify(musicalDesc) === JSON.stringify(mapToMusical(desc)));

      // --- Realizer tests ---
      log.innerHTML += "\n== Realizer ==\n";

      assert("createSonarPlayer returns object", typeof createSonarPlayer === "function");

      const player = createSonarPlayer(musicalDesc);
      assert("player has play method", typeof player.play === "function");
      assert("player has stop method", typeof player.stop === "function");
      assert("player has onStep callback setter", typeof player.onStep === "function");
      assert("player has noteCount", typeof player.noteCount === "number");
      assert("noteCount matches non-rest notes", player.noteCount === musicalDesc.notes.filter(n => !n.rest).length);

      // --- Integration tests ---
      log.innerHTML += "\n== Integration ==\n";

      const cleanHtml = `<html><body style="margin:40px;font-family:serif;color:#333;background:#fff">
  <h1 style="font-size:32px;margin-bottom:20px">Clean</h1>
  <p style="line-height:1.6">Simple paragraph.</p>
</body></html>`;

      const messyHtml = `<html><body style="margin:0;background:#ff0;color:#f0f">
  <div style="background:#0ff"><b style="color:red;font-size:40px">LOUD</b></div>
  <div style="background:#f0f"><span style="color:#ff0">text</span><span style="color:#0f0">more</span><span style="color:#00f">stuff</span></div>
  <input><input><input><button>GO</button><button>GO</button>
</body></html>`;

      const cleanDesc = await extractDesignDescriptor(cleanHtml);
      const messyDesc = await extractDesignDescriptor(messyHtml);
      const cleanMusic = mapToMusical(cleanDesc);
      const messyMusic = mapToMusical(messyDesc);

      assert("messy has more colors", messyDesc.colorPalette.length > cleanDesc.colorPalette.length);
      assert("messy has more scale notes", messyMusic.mode.length >= cleanMusic.mode.length);
      assert("messy has faster tempo", messyMusic.tempo >= cleanMusic.tempo);
      assert("clean has more rests", cleanMusic.notes.filter(n=>n.rest).length >= messyMusic.notes.filter(n=>n.rest).length);
      assert("both are deterministic (clean)", JSON.stringify(mapToMusical(cleanDesc)) === JSON.stringify(cleanMusic));
      assert("both are deterministic (messy)", JSON.stringify(mapToMusical(messyDesc)) === JSON.stringify(messyMusic));

      summary();
    }

    runTests();
  </script>
</body>
</html>
